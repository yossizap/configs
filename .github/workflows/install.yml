name: Installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Configuration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux vim-nox zsh
      - name: Lint shell and configuration files
        run: tests/lint.sh

  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Run installer smoke test
        run: tests/install-in-docker.sh "${{ matrix.ubuntu }}"
