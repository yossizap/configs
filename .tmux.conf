# Act like Vim
set-window-option -g mode-keys vi

# Automatic window rename
set-window-option -g automatic-rename

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-Left
unbind -n C-Down
unbind -n C-Up
unbind -n C-Right
bind -n M-Left run "($is_vim && tmux send-keys M-Left) || \
                          tmux select-pane -L"
bind -n M-Down run "($is_vim && tmux send-keys M-j)  || \
                         ($is_fzf && tmux send-keys C-j) || \
                         tmux select-pane -D"
bind -n M-Up run "($is_vim && tmux send-keys M-k) || \
                          ($is_fzf && tmux send-keys C-k)  || \
                          tmux select-pane -U"
bind -n M-Right run  "($is_vim && tmux send-keys M-Right) || \
                          tmux select-pane -R"
bind -n M-h run "($is_vim && tmux send-keys M-h) || \
                          tmux select-pane -L"
bind -n M-j run "($is_vim && tmux send-keys M-j)  || \
                         ($is_fzf && tmux send-keys C-j) || \
                         tmux select-pane -D"
bind -n M-k run "($is_vim && tmux send-keys M-k) || \
                          ($is_fzf && tmux send-keys C-k)  || \
                          tmux select-pane -U"
bind -n M-l run  "($is_vim && tmux send-keys M-l) || \
                          tmux select-pane -R"

# Prefix pane navigation
bind h run "($is_vim && tmux send-keys M-h) || tmux select-pane -L"
bind j run "($is_vim && tmux send-keys M-j) || tmux select-pane -D"
bind k run "($is_vim && tmux send-keys M-k) || tmux select-pane -U"
bind l run "($is_vim && tmux send-keys M-l) || tmux select-pane -R"
bind Left run "($is_vim && tmux send-keys M-h) || tmux select-pane -L"
bind Down run "($is_vim && tmux send-keys M-j) || tmux select-pane -D"
bind Up run "($is_vim && tmux send-keys M-k) || tmux select-pane -U"
bind Right run "($is_vim && tmux send-keys M-l) || tmux select-pane -R"

# Switch between windows
bind -n S-Left previous-window
bind -n S-Right next-window

# New window/pane opens the same path
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# vi-mode copy
bind [ run "($is_vim && tmux send-keys F12) || tmux copy-mode"
bind -n WheelUpPane if-shell "$is_vim" \
    "send-keys F11" \
    "if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane if-shell "$is_vim" "send-keys F10" "send-keys -M"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Look good
set-option -g default-terminal "tmux-256color"
set-option -g terminal-overrides '*88col*:colors=88,*256col*:colors=256,xterm*:XT:Ms=\E]52;%p1%s;%p2%s\007:Cc=\E]12;%p1%s\007:Cr=\E]112\007:Cs=\E]50;CursorShape=%?%p1%{3}%<%t%{0}%e%p1%{2}%-%;%d\007,*:Tc'
run-shell -b "tmux set -as terminal-features ',*:RGB' 2>/dev/null || true"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# set up layouts
# set main-pane-width 130

# scrollback buffer size increase
set -g history-limit 50000

# C-b C-b will swap to last used window
bind-key C-b last-window

# Start tab numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 10

# Highlight active pane
set-option -g pane-active-border-style fg=green

# Status update interval
set -g status-interval 1

# Basic status bar colors
set-option -g status-style bg=colour235,fg=colour136

# Left side of status bar
set -g status-left-style bg=colour235,fg=green
set -g status-left-length 40
set -g status-left "#S #[fg=white]» #[fg=yellow]#I #[fg=cyan]#P"

# Right side of status bar
set -g status-right-style bg=colour235,fg=cyan
set -g status-right-length 40
set -g status-right "#H #[fg=white]« #[fg=yellow]%H:%M:%S #[fg=green]%d-%b-%y"

# Window status
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default

# Current window status
set-window-option -g window-status-current-style fg=colour166,bg=default

# Window with activity status
set -g window-status-activity-style bg=colour33,fg=black

# Window separator
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane border
set -g pane-border-style bg=default,fg=default

# Pane number indicator
set -g display-panes-colour default
set -g display-panes-active-colour default

# Clock mode
set -g clock-mode-colour red
set -g clock-mode-style 24

# Message
set -g message-style bg=default,fg=default

# Command message
set -g message-command-style bg=default,fg=default

# Mode
set -g mode-style bg=red,fg=default

# Enable mouse support for coworkers
setw -g mouse on

# set shell when zsh is available
if-shell "test -x /usr/bin/zsh" "set -g default-shell /usr/bin/zsh"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Prefix+Ctrl+s to save tmux and Prefix+Ctrl+r to restore tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Automatic saving and restoration with tmux-resurrect when tmux is started
set -g @plugin 'tmux-plugins/tmux-continuum'

# Easymotion styled jumps with Prefix+j
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'J'

# Fuzzy search in tmux history with Prefix+f
set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind f
# Spawn an fzf terminal
set -g @fuzzback-popup 1
# Hide preview
set -g @fuzzback-hide-preview 1

# Update DISPLAY= in all tmux tabs after connecting with ssh -x
set -g @plugin 'lljbash/tmux-update-display'

# Use completions from window history with Prefix+TAB
set -g @plugin 'laktak/extrakto'

# Tmux session management with fzf through Prefix+F
set -g @plugin 'sainnhe/tmux-fzf'
set-environment -g TMUX_FZF_OPTIONS "-p -w 62% -h 38% -m --preview-window=:follow"

# Log and save pane history
# prefix + alt + shift + p - Save complete history in current pane
# prefix + shift + p - toggle logging in current pane
set -g @plugin 'tmux-plugins/tmux-logging'

%if "#{==:#{E:TMUX_THEME_PREVIEW},}"
source-file -q ~/.tmux/theme.conf
source-file -q ~/.tmux.conf.local
%endif

if-shell "test -z \"$TMUX_THEME_PREVIEW\" && test ! -d ~/.tmux/plugins/tpm" \
   "run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

if-shell "test -z \"$TMUX_THEME_PREVIEW\"" "run -b '~/.tmux/plugins/tpm/tpm'"
